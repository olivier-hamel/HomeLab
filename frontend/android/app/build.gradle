apply plugin: 'com.android.application'

android {
    namespace "ca.olivierhamel.homelab"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "ca.olivierhamel.homelab"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 6
        versionName "1.3.1-connect"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Personal debug builds can trust the owner's Caddy CA without disabling TLS
// verification or changing the Fire TV's system certificate store.
def configuredHomeLabCa = System.getenv('HOMELAB_CA_CERT')
def homeLabCa = configuredHomeLabCa ? file(configuredHomeLabCa) : rootProject.file('../../.tools/certs/homelab-caddy-root.crt')
if (configuredHomeLabCa && !homeLabCa.isFile()) {
    throw new GradleException("HOMELAB_CA_CERT does not point to a certificate file: ${homeLabCa}")
}
if (homeLabCa.isFile()) {
    def trustResources = layout.buildDirectory.dir('generated/homelab-trust/res')
    def generateHomeLabTrust = tasks.register('generateHomeLabTrust') {
        inputs.file(homeLabCa)
        outputs.dir(trustResources)
        doLast {
            def certificate = homeLabCa.withInputStream {
                java.security.cert.CertificateFactory.getInstance('X.509').generateCertificate(it)
            }
            certificate.checkValidity()
            if (certificate.basicConstraints < 0) {
                throw new GradleException('The HomeLab certificate must be a CA certificate, not a server certificate.')
            }
            def resourceRoot = trustResources.get().asFile
            copy {
                from homeLabCa
                into new File(resourceRoot, 'raw')
                rename { 'homelab_ca.crt' }
            }
            def config = new File(resourceRoot, 'xml/network_security_config.xml')
            config.parentFile.mkdirs()
            config.text = '''<?xml version="1.0" encoding="utf-8"?>
<network-security-config>
    <base-config cleartextTrafficPermitted="true">
        <trust-anchors>
            <certificates src="system" />
            <certificates src="user" />
            <certificates src="@raw/homelab_ca" />
        </trust-anchors>
    </base-config>
</network-security-config>
'''
        }
    }
    android.sourceSets.debug.res.srcDir(trustResources)
    tasks.named('preBuild').configure { dependsOn(generateHomeLabTrust) }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:1.9.0"
    // Pinned to the SDK 34 compatible Media3 line for this Fire OS 5+ shell.
    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-ui:1.4.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
