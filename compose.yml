services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_MEMO_HTTPS_PORT: "${FRONTEND_HTTPS_PORT:-3443}"
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:8080"
      - "${TAILSCALE_BIND_ADDRESS:-127.0.0.1}:${TAILSCALE_PORT:-3002}:8080"
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_HTTPS_PORT:-3443}:8443"
      - "${TAILSCALE_BIND_ADDRESS:-127.0.0.1}:${TAILSCALE_HTTPS_PORT:-3444}:8444"
    environment:
      HTTPS_LAN_HOST: "${HTTPS_LAN_HOST:-localhost}"
      HTTPS_TAILSCALE_HOST: "${HTTPS_TAILSCALE_HOST:-localhost}"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "--timeout=3", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3001"
      # Local .env may contain Windows executable paths; the image uses apt's binaries.
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health', { signal: AbortSignal.timeout(3000) }).then(async r => { if (!r.ok || (await r.json()).status !== 'ok') process.exit(1); }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app

  memo:
    build:
      context: "${MEMO_SOURCE_DIR:-../memo}/web-app"
    image: memo-app:local
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - memo_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app

volumes:
  memo_data:
  caddy_data:
  caddy_config:

networks:
  app:
    driver: bridge
